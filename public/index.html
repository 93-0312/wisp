<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WISP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 몰래 모드 토글: 어느 화면에서든 우상단 -->
  <button id="stealthBtn" class="stealth-btn" type="button" title="몰래 모드 (Alt+S)">◐</button>

  <!-- 긴급 가림막: Esc 두 번 → 평범한 빈 메모 화면 -->
  <div id="cover" class="cover hidden" aria-hidden="true">
    <div class="cover-page">
      <div class="cover-title">메모</div>
      <div class="cover-line w80"></div>
      <div class="cover-line w60"></div>
      <div class="cover-line w90"></div>
      <div class="cover-line w40"></div>
    </div>
  </div>

  <!-- 입장 화면 -->
  <section id="lobby" class="lobby">
    <h1 class="logo">WISP</h1>
    <p class="tagline">말은 연기처럼, 흔적 없이.</p>
    <div class="preview">
      <div id="previewAvatar" class="avatar big"></div>
      <div id="previewName" class="preview-name"></div>
      <button id="rerollBtn" class="ghost" type="button">🎲 다른 모습</button>
    </div>
    <button id="enterBtn" class="primary" type="button">들어가기</button>
    <p id="lobbyError" class="error"></p>
    <p class="fineprint">대화는 저장되지 않고, 새로고침하면 아무것도 남지 않아요.</p>
    <p class="fineprint">◐ 몰래 모드 (Alt+S) · Esc 두 번 = 가림막</p>
  </section>

  <!-- 채팅 공간 -->
  <main id="app" class="app hidden">
    <header class="topbar">
      <span class="logo small">WISP</span>
      <span id="count" class="count"></span>
      <span class="topbar-spacer"></span>
    </header>
    <div id="room" class="room">
      <div id="hint" class="hint">클릭하거나 방향키(WASD)로 이동</div>
    </div>
    <div id="actions" class="actions">
      <button type="button" tabindex="-1" data-hold="puff" title="길게 눌렀다 떼면 후~ (Space)">💨<small>Space</small></button>
      <button type="button" tabindex="-1" data-act="sigh" title="한숨 (1)">😮‍💨<small>1</small></button>
      <button type="button" tabindex="-1" data-act="bubbles" title="비눗방울 (2)">🫧<small>2</small></button>
      <button type="button" tabindex="-1" data-act="plane" title="종이비행기 귓속말 (3)">✈️<small>3</small></button>
      <button type="button" tabindex="-1" data-act="coffee" title="커피 홀짝 (4)">☕<small>4</small></button>
      <button type="button" tabindex="-1" data-act="poke" title="쿡 찌르기 (5)">👉<small>5</small></button>
      <button type="button" tabindex="-1" data-act="hide" title="소품으로 변신 (6)">🪴<small>6</small></button>
    </div>
    <form id="chatForm" class="chat">
      <input id="chatInput" maxlength="200" autocomplete="off" placeholder="속삭이기… (Enter)" />
      <button class="primary" type="submit">보내기</button>
    </form>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
